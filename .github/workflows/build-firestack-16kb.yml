name: Build Firestack 16KB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Firestack
        uses: actions/checkout@v4
        with:
          repository: celzero/firestack
          path: firestack

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"

       - name: Install gomobile
        working-directory: firestack
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/felixge/go-patch-overlay@latest

      - name: Build Firestack
        working-directory: firestack
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          gomobile init
          make android

      - name: Locate AAR
        run: |
          echo "=== AAR ==="
          find firestack -type f -name "*.aar" -print

      - name: Extract and verify native libraries
        run: |
          AAR=$(find firestack -type f -name "*.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo "ERRO: AAR não encontrado"
            exit 1
          fi

          mkdir -p verify
          unzip -q "$AAR" -d verify

          echo "=== Native libraries ==="
          find verify -type f -name "*.so" -print

          echo "=== ELF LOAD ALIGNMENT ==="

          for SO in $(find verify -type f -name "*.so"); do
            echo
            echo ">>> $SO"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" \
              -p "$SO" | grep -E "LOAD|align"
          done

      - name: Upload Firestack AAR
        uses: actions/upload-artifact@v4
        with:
          name: firestack-16kb-aar
          path: firestack/**/*.aar
