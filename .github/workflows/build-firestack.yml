name: Build Firestack 16KB

on:
  workflow_dispatch:

jobs:
  build-firestack:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Firestack
        uses: actions/checkout@v4
        with:
          repository: celzero/firestack
          path: firestack

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.2
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;28.2.13676358"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Build Firestack
        working-directory: firestack
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          gomobile init

          make android

      - name: Locate AAR
        run: |
          find firestack -type f \( -name "*.aar" -o -name "libgojni.so" \) -print

      - name: Upload Firestack AAR
        uses: actions/upload-artifact@v4
        with:
          name: firestack-16kb-aar
          path: |
            firestack/**/*.aar
