name: Build Firestack 16KB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Firestack
        uses: actions/checkout@v4
        with:
          repository: celzero/firestack
          path: firestack

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"

      - name: Prepare Firestack
        working-directory: firestack
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo "========================================"
          echo "GO"
          echo "========================================"
          go version

          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          echo "$ANDROID_NDK_HOME"

          echo "========================================"
          echo "ADDING GOBIND TO MODULE"
          echo "========================================"

          go get -tool golang.org/x/mobile/cmd/gobind@latest

          echo "=== go.mod AFTER go get -tool ==="
          cat go.mod

          echo "========================================"
          echo "GO MOD TIDY"
          echo "========================================"

          go mod tidy

          echo "=== go.mod AFTER tidy ==="
          cat go.mod

          echo "========================================"
          echo "VERIFY GOBIND"
          echo "========================================"

          go list -m all | grep 'golang.org/x/mobile' || true

          go tool gobind -h >/dev/null

          echo "gobind OK"

      - name: Build Firestack
        working-directory: firestack
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo "========================================"
          echo "BUILD FIRESTACK"
          echo "========================================"

          make android

      - name: Locate AAR
        run: |
          echo "=== AAR ==="

          find firestack -type f -name "*.aar" -print

          AAR=$(find firestack -type f -name "*.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo "ERRO: AAR não encontrado"
            exit 1
          fi

          echo "AAR:"
          echo "$AAR"

      - name: Verify 16KB ELF alignment
        run: |
          set -e

          AAR=$(find firestack -type f -name "*.aar" | head -1)

          rm -rf verify
          mkdir -p verify

          unzip -q "$AAR" -d verify

          LLVM_OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"

          FAILED=0

          while IFS= read -r SO; do

            echo
            echo "========================================"
            echo "$SO"
            echo "========================================"

            OUTPUT=$("$LLVM_OBJDUMP" -p "$SO" | grep "LOAD" || true)

            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "align 2\*\*12"; then
              echo "ERRO: alinhamento 4 KB"
              FAILED=1
            fi

            if echo "$OUTPUT" | grep -q "align 2\*\*14"; then
              echo "OK: alinhamento 16 KB"
            else
              echo "ERRO: alinhamento 16 KB não encontrado"
              FAILED=1
            fi

          done < <(find verify -type f -name "*.so")

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "FALHA: Firestack não está 100% alinhado em 16 KB."
            exit 1
          fi

          echo
          echo "SUCESSO: Firestack alinhado em 16 KB."

      - name: Upload Firestack AAR
        uses: actions/upload-artifact@v4
        with:
          name: firestack-16kb-aar
          path: firestack/**/*.aar
