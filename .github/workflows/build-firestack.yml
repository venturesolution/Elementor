name: Build Firestack 16KB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # FIRESTACK
      # ============================================================

      - name: Checkout Firestack
        uses: actions/checkout@v4
        with:
          repository: celzero/firestack
          path: firestack

      # ============================================================
      # GO
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # ANDROID NDK 28
      # ============================================================

      - name: Install NDK 28.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"

      # ============================================================
      # PREPARAR FIRESTACK
      # ============================================================

      - name: Prepare Firestack
        working-directory: firestack
        run: |
          set -e

          export PATH="$PWD/bin:$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo
          echo "========================================"
          echo " GO VERSION"
          echo "========================================"

          go version

          echo
          echo "========================================"
          echo " ANDROID NDK"
          echo "========================================"

          echo "$ANDROID_NDK_HOME"

          echo
          echo "========================================"
          echo " FIRESTACK GO.MOD"
          echo "========================================"

          cat go.mod

          echo
          echo "========================================"
          echo " X/MOBILE DEPENDENCY"
          echo "========================================"

          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)

          echo "golang.org/x/mobile = $MOBILE_VERSION"

          if [ -z "$MOBILE_VERSION" ] || [ "$MOBILE_VERSION" = "<nil>" ]; then
            echo "ERRO: golang.org/x/mobile não encontrado."
            exit 1
          fi

          echo
          echo "========================================"
          echo " INSTALL GOMOBILE"
          echo "========================================"

          GOBIN="$PWD/bin" go install \
            golang.org/x/mobile/cmd/gomobile@"$MOBILE_VERSION"

          echo
          echo "========================================"
          echo " INSTALL GOBIND"
          echo "========================================"

          GOBIN="$PWD/bin" go install \
            golang.org/x/mobile/cmd/gobind@"$MOBILE_VERSION"

          echo
          echo "========================================"
          echo " VERIFY GOMOBILE"
          echo "========================================"

          "$PWD/bin/gomobile" version || true

          echo
          echo "========================================"
          echo " VERIFY GOBIND"
          echo "========================================"

          "$PWD/bin/gobind" -h >/dev/null

          echo
          echo "GOMOBILE/GOBIND OK"

      # ============================================================
      # BUILD FIRESTACK
      # ============================================================

      - name: Build Firestack
        working-directory: firestack
        run: |
          set -e

          export PATH="$PWD/bin:$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo
          echo "========================================"
          echo " BUILD FIRESTACK"
          echo "========================================"

          echo "Go:"
          go version

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "PATH:"
          echo "$PATH"

          echo
          echo "GOMOBILE:"
          command -v gomobile
          gomobile version || true

          echo
          echo "GOBIND:"
          command -v gobind

          echo
          echo "========================================"
          echo " MAKE ANDROID"
          echo "========================================"

          make android

      # ============================================================
      # LOCALIZAR AAR
      # ============================================================

      - name: Locate AAR
        run: |
          set -e

          echo
          echo "========================================"
          echo " FIRESTACK AAR"
          echo "========================================"

          find firestack -type f -name "*.aar" -print

          AAR=$(find firestack -type f -name "*.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo
            echo "ERRO: AAR não encontrado."
            exit 1
          fi

          echo
          echo "AAR encontrado:"
          echo "$AAR"

      # ============================================================
      # EXTRAIR AAR
      # ============================================================

      - name: Extract AAR
        run: |
          set -e

          AAR=$(find firestack -type f -name "*.aar" | head -1)

          if [ -z "$AAR" ]; then
            echo "ERRO: AAR não encontrado."
            exit 1
          fi

          rm -rf verify
          mkdir -p verify

          unzip -q "$AAR" -d verify

          echo
          echo "========================================"
          echo " NATIVE LIBRARIES"
          echo "========================================"

          find verify -type f -name "*.so" -print

      # ============================================================
      # VERIFICAR ELF 16 KB
      # ============================================================

      - name: Verify 16KB ELF alignment
        run: |
          set -e

          LLVM_OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"

          if [ ! -x "$LLVM_OBJDUMP" ]; then
            echo
            echo "ERRO: llvm-objdump não encontrado:"
            echo "$LLVM_OBJDUMP"
            exit 1
          fi

          echo
          echo "========================================"
          echo " ELF LOAD ALIGNMENT"
          echo "========================================"

          FAILED=0
          LIB_COUNT=0

          while IFS= read -r SO; do

            LIB_COUNT=$((LIB_COUNT + 1))

            echo
            echo "----------------------------------------"
            echo "Biblioteca:"
            echo "$SO"
            echo "----------------------------------------"

            OUTPUT=$("$LLVM_OBJDUMP" -p "$SO" | grep "LOAD" || true)

            echo "$OUTPUT"

            if [ -z "$OUTPUT" ]; then
              echo "ERRO: nenhum LOAD encontrado."
              FAILED=1
              continue
            fi

            echo
            echo "Alinhamentos encontrados:"

            echo "$OUTPUT" |
              grep -o 'align 2\*\*[0-9]*' |
              sort -u || true

            # 2**12 = 4 KB
            if echo "$OUTPUT" | grep -q "align 2\*\*12"; then
              echo "ERRO: alinhamento de 4 KB detectado!"
              FAILED=1
            fi

            # 2**14 = 16 KB
            if echo "$OUTPUT" | grep -q "align 2\*\*14"; then
              echo "OK: alinhamento de 16 KB detectado."
            else
              echo "ERRO: alinhamento 2**14 (16 KB) não encontrado!"
              FAILED=1
            fi

          done < <(find verify -type f -name "*.so")

          echo
          echo "========================================"
          echo " RESULTADO"
          echo "========================================"

          echo "Bibliotecas verificadas: $LIB_COUNT"

          if [ "$LIB_COUNT" -eq 0 ]; then
            echo "ERRO: nenhuma biblioteca .so encontrada."
            exit 1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "========================================"
            echo " FALHA"
            echo "========================================"
            echo
            echo "Uma ou mais bibliotecas não estão"
            echo "corretamente alinhadas para páginas de 16 KB."
            echo
            exit 1
          fi

          echo
          echo "========================================"
          echo " SUCESSO"
          echo "========================================"
          echo
          echo "Todas as bibliotecas ELF estão alinhadas"
          echo "em 16 KB."
          echo

      # ============================================================
      # UPLOAD AAR
      # ============================================================

      - name: Upload Firestack AAR
        uses: actions/upload-artifact@v4
        with:
          name: firestack-16kb-aar
          path: firestack/**/*.aar
          if-no-files-found: error
